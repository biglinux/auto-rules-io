# pacman runs ldconfig after every transaction (libalpm), so the cache is
# current at boot; rebuilding it after each update only delays
# sysinit.target. It is still built when missing or empty.
# An empty assignment clears every condition of the unit, so the
# missing-cache one is restated.
[Unit]
ConditionNeedsUpdate=
ConditionFileNotEmpty=!/etc/ld.so.cache
