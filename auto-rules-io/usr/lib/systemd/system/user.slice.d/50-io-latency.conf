# Disk latency target for the sessions on the system disks. While the
# session's I/O misses it, the kernel (io.latency) throttles the other
# top-level groups on that disk: system.slice and machine.slice, so system
# services, containers and VMs, including work done for the user (package
# updates, Docker builds). While the session does no I/O they run at full
# speed.
# 2 ms is the one value that serves both NVMe and HDD: 1 ms is slower on
# HDDs, 3 ms on NVMe.
[Slice]
IODeviceLatencyTargetSec=/ 2ms
IODeviceLatencyTargetSec=/home 2ms
